# Priority score weights — transparent and tunable, not a black box.
# priority = balance_weight * bucket_weight * ptp_reliability_penalty * contactability
# See src/collections_agent/precall/priority.py for how these are applied.

bucket_weight:
  pre_due: 0.5
  "1-30": 1.0
  "31-60": 1.5
  "61-90": 2.0
  # 90+ is never scored — it's suppressed and routed to a human before priority is computed.

balance_weight_cap: 3.0
balance_weight_denominator: 10000.0

ptp_reliability_min: 0.5
ptp_reliability_broken_penalty: 0.5

contactability_wrong_person: 0.7
contactability_default: 1.0
