[project]
name = "collections-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashu", email = "ashutoshedamadaka@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faker>=40.39.0",
    "fastapi>=0.141.1",
    "google-auth>=2.58.0",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.14.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
collections-agent = "collections_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = [
    # date.today()/datetime.now() without an explicit tz appear only as fallback defaults for
    # an `as_of`/`now` parameter (precall/*.py, data/fake_data_gen.py) — real timezone-sensitive
    # logic (suppression.py's calling-hours check) already uses zoneinfo explicitly.
    "DTZ011",
    "DTZ005",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.16.7",
    "time-machine>=3.5.1",
]
